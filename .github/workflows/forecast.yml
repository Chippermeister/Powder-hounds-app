# Hourly data refresh: fetch forecasts (NWS + Open-Meteo) and observed snow (SNOTEL + NOHRSC),
# build, and deploy to Cloudflare. Pushes still deploy through Workers Builds (which also fetches both, via "prebuild").
# Needs repo secrets CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.
# Until they exist, the job fetches and builds but skips the deploy.
name: Forecast

on:
  schedule:
    - cron: '17 * * * *' # hourly, off the top of the hour when GitHub's scheduler is busiest
  workflow_dispatch:

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run forecast
      - run: npm run observed
      - run: npm run build
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 deploy
